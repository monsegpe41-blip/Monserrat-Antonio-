<head>

<title>Monserrat & Antonio — Nuestra boda</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#eeeae1;color:#465846}
body{min-height:100vh;overflow:hidden}
.stage{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;position:relative;padding:14px;overflow:hidden}
.cover{position:absolute;width:min(430px,96vw);height:min(760px,96vh);border:0;background:transparent;cursor:pointer;z-index:5;transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .8s ease;transform-origin:center center}
.cover img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 18px 35px rgba(48,61,48,.22));border-radius:8px}
.cover .hint{position:absolute;left:50%;bottom:7.5%;transform:translateX(-50%);background:rgba(255,255,255,.88);padding:10px 18px;border-radius:30px;white-space:nowrap;font:600 12px Arial,sans-serif;letter-spacing:.6px;color:#536352;box-shadow:0 5px 18px rgba(45,55,45,.12)}
.cover.open{transform:scale(1.035) translateY(-5%);opacity:0;pointer-events:none}
.invitation{position:absolute;inset:0;overflow:auto;background:#edf0e9;opacity:0;transform:translateY(30px);transition:opacity .75s ease .55s,transform .75s ease .55s;padding:12px 0 36px}
.invitation.show{opacity:1;transform:none}
.card{width:min(520px,96vw);margin:0 auto;background:white;border-radius:10px;overflow:hidden;box-shadow:0 12px 42px rgba(40,55,43,.18)}
.card img{display:block;width:100%;height:auto}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px;background:#f8f6ef}
.actions a{text-decoration:none;font:600 13px Arial,sans-serif;padding:11px 16px;border-radius:999px;background:#6f806c;color:#fff}
.actions a.secondary{background:#fff;color:#506050;border:1px solid #aab5a7}
</style>
